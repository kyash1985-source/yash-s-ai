<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yash's AI</title>
    <style>
        :root { --bg: #0f0f0f; --sidebar: #1a1a1a; --accent: #4caf50; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #e0e0e0; margin: 0; display: flex; height: 100vh; }

        #sidebar { width: 280px; background-color: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; }
        #new-chat-btn { background: #2d2d2d; color: white; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        #new-chat-btn:hover { background: #3d3d3d; }

        #history-list { flex-grow: 1; overflow-y: auto; }
        .history-item { padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 8px; font-size: 0.9em; transition: 0.2s; }
        .history-item:hover { background: #262626; }

        #main { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        header { padding: 20px; font-size: 1.5rem; font-weight: 700; border-bottom: 1px solid #333; color: var(--accent); }

        #chat-area { flex-grow: 1; overflow-y: auto; padding: 40px 20%; display: flex; flex-direction: column; gap: 20px; }
        .message { padding: 12px 20px; border-radius: 15px; max-width: 80%; animation: fadeIn 0.3s ease; }
        .user { background-color: #2b5278; align-self: flex-end; }
        .ai { background-color: #262626; align-self: flex-start; border: 1px solid #333; }

        #input-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 50%; display: flex; gap: 10px; background: #1a1a1a; padding: 10px; border-radius: 30px; border: 1px solid #333; }
        #user-input { flex-grow: 1; background: transparent; border: none; color: white; padding: 10px 20px; outline: none; }
        #send-btn, #voice-btn { background: var(--accent); border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; color: black; font-weight: bold; }
        #voice-btn { background: #555; color: white; }
        #voice-btn.active { background: #ff4444; }

        #status-indicator {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 0.85rem;
            font-style: italic;
            display: none;
            gap: 5px;
            align-items: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <button id="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        <div id="history-list"></div>
    </div>
    <div id="main">
        <header>Yash's AI</header>
        <div id="chat-area"></div>
        <div id="status-indicator"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Message Yash's AI...">
            <button id="voice-btn">🎤</button>
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script>
        let chats = [{ id: Date.now(), title: "New Chat", messages: [] }];
        let currentChatId = chats[0].id;

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerText = chat.title;
                div.onclick = () => switchChat(chat.id);
                list.appendChild(div);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            document.getElementById('chat-area').innerHTML = '';
            chats.find(c => c.id === id).messages.forEach(msg => appendToChat(msg.role, msg.text));
        }

        function startNewChat() {
            const id = Date.now();
            chats.unshift({ id, title: "New Chat", messages: [] });
            switchChat(id);
            renderHistory();
        }

        function appendToChat(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            document.getElementById('chat-area').appendChild(div);
            document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;

            if (role === 'ai') {
                const speech = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(speech);
            }
        }

        const voiceBtn = document.getElementById('voice-btn');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';

        voiceBtn.onclick = () => {
            if (voiceBtn.classList.contains('active')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        };

        recognition.onstart = () => voiceBtn.classList.add('active');
        recognition.onend = () => voiceBtn.classList.remove('active');
        // Updated voice recognition logic
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('user-input').value = transcript;
            voiceBtn.classList.remove('active');
            // Removed automatic sendMessage()
        };

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 20) + "...";

            appendToChat('user', text);
            chat.messages.push({ role: 'user', text });
            input.value = '';

            const statusEl = document.getElementById('status-indicator');
            statusEl.style.display = 'flex';

            const steps = [
                "Cooking thoughts...",
                "Searching knowledge base...",
                "Synthesizing response...",
                "Almost ready..."
            ];

            let stepIndex = 0;
            statusEl.innerText = steps[stepIndex];

            const interval = setInterval(() => {
                stepIndex = (stepIndex + 1) % steps.length;
                statusEl.innerText = steps[stepIndex];
            }, 1200);

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                const aiText = data.reply || data.error;

                clearInterval(interval);
                statusEl.innerText = "Crunched!";
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 1500);

                appendToChat('ai', aiText);
                chat.messages.push({ role: 'ai', text: aiText });
                renderHistory();
            } catch (err) {
                clearInterval(interval);
                statusEl.innerText = "Error occurred!";
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 1500);
            }
        }

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('user-input').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        renderHistory();
    </script>
</body>
</html>
